name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'infra/**', '.github/workflows/infra.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'infra/**', '.github/workflows/infra.yml']

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a publish on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: calculator

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit + integration tests, merged JaCoCo report, coverage gate (see pom.xml)
      - run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: target/site/jacoco-merged/
      # Compiled classes and reports, so the sonar job can analyse without rebuilding
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          retention-days: 1
          path: |
            target/classes/
            target/test-classes/
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco-merged/jacoco.xml

  sonar:
    needs: build-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      FORK_PR: ${{ github.event.pull_request.head.repo.fork == true }}
    steps:
      # Fork PRs get no secrets, so skip there; anywhere else a missing token is a setup error
      - name: Check SONAR_TOKEN
        if: env.SONAR_TOKEN == '' && env.FORK_PR != 'true'
        run: |
          echo "::error::SONAR_TOKEN secret is not set"
          exit 1
      - if: env.SONAR_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for blame and new-code detection
      - if: env.SONAR_TOKEN != ''
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: target/
      - if: env.SONAR_TOKEN != ''
        run: ./mvnw -B sonar:sonar -Dsonar.qualitygate.wait=true

  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Resolve the real runtime jars (incl. transitive deps managed by the Spring Boot BOM);
      # scanning pom.xml alone misses them
      - name: Resolve runtime dependencies
        run: ./mvnw -B -q dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=target/dependency
      - name: Trivy fs (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: target/dependency
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'
      - name: Upload Trivy fs SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true # Security tab needs a public repo or GitHub Advanced Security
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Trivy fs (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: target/dependency
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          skip-setup-trivy: true

  image:
    needs: [build-test, sonar, dependency-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image tag
        id: tag
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          echo "TAG=sha-${SHA::7}" >> "$GITHUB_ENV"
          echo "tag=sha-${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build into the local daemon only; nothing is pushed until it passes the scans
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          build-args: APP_VERSION=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-image.sarif
          exit-code: '0'
      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
      - name: Trivy image (gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore
          skip-setup-trivy: true

      # Second vulnerability database as a cross-check
      - name: Grype image (gate)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          only-fixed: true
          severity-cutoff: high
          fail-build: true
      - name: Upload Grype SARIF
        if: always() && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}:${{ env.TAG }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json

      # The publish job loads this exact scanned image instead of rebuilding
      - name: Save image
        run: docker save "$IMAGE:$TAG" -o image.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-tar
          path: image.tar
          retention-days: 1
          compression-level: 0

  # Main only, and only once the AWS infrastructure exists (repo variable AWS_ROLE_ARN is set)
  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token: assume the AWS role and sign keylessly with Cosign
    env:
      TAG: ${{ needs.image.outputs.tag }}
    outputs:
      image-ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-tar
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
      - run: docker load -i image.tar

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable in ECR, so a re-run of the same commit skips the push
      - name: Push to ECR
        id: push
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE }}
        run: |
          if aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "$REPO:$TAG already exists, skipping push"
          else
            docker tag "$IMAGE:$TAG" "$REPO:$TAG"
            docker push "$REPO:$TAG"
          fi
          DIGEST=$(aws ecr describe-images --repository-name "$IMAGE" --image-ids imageTag="$TAG"             --query 'imageDetails[0].imageDigest' --output text)
          echo "ref=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"

      # Keyless: the signature is bound to this workflow's identity, recorded in the public Rekor log
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image and attach SBOM attestation
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"

      - name: Summary
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: |
          {
            echo "### Published"
            echo "\`$REF\`"
            echo ""
            echo "Verify:"
            echo "\`\`\`"
            echo "cosign verify $REF \\"
            echo "  --certificate-identity-regexp '^https://github.com/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deploy to dev = commit the new tag to the GitOps repo; Argo CD does the rest
  update-gitops:
    needs: [image, publish]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.image.outputs.tag }}
      IMAGE_REF: ${{ needs.publish.outputs.image-ref }}
      KUSTOMIZE_VERSION: v5.8.3
      KUSTOMIZE_SHA256: cb9e31198d3f63b44848bd0afc4c8efc56e6cfef9c93a4a39a211940e6decd61
    steps:
      # Short-lived token from the GitHub App, valid only for the gitops repo
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.GITOPS_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: calculator-gitops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/calculator-gitops
          token: ${{ steps.app.outputs.token }}
          path: gitops

      - name: Install kustomize
        run: |
          curl -fsSL --proto '=https' --tlsv1.2 -o kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tar.gz" | sha256sum -c -
          tar -xzf kustomize.tar.gz kustomize
          sudo install kustomize /usr/local/bin/

      - name: Set dev image tag
        working-directory: gitops/overlays/dev
        run: |
          REPO="${IMAGE_REF%@*}"
          kustomize edit set image "calculator=${REPO}:${TAG}"
          git diff

      - name: Commit and push
        working-directory: gitops
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          if git diff --quiet; then
            echo "overlays/dev already at $TAG, nothing to commit"
            exit 0
          fi
          BOT_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "dev: calculator ${TAG}" \
            -m "Image: ${IMAGE_REF}" \
            -m "Source: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Another run may have pushed first; replay this one-line change on top
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase
          done
          exit 1
