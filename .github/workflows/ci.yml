name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'infra/**', '.github/workflows/infra.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'infra/**', '.github/workflows/infra.yml']

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a publish on main
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline itself lives in yashago/ci-workflows, shared by every service.
  # This file only says which service this is and what the pipeline may use.
  pipeline:
    uses: yashago/ci-workflows/.github/workflows/java-service.yml@v1
    permissions: # the most the shared pipeline may use; each job takes less
      contents: read
      pull-requests: read
      security-events: write
      id-token: write
    with:
      image-name: calculator
      gitops-repo: calculator-gitops
      aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
      aws-region: ${{ vars.AWS_REGION }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITOPS_APP_CLIENT_ID: ${{ secrets.GITOPS_APP_CLIENT_ID }}
      GITOPS_APP_PRIVATE_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
